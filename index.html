<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to World of Hackers</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            position: relative;
            height: 100vh;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        header {
            background-color: #333;
            padding: 20px;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
        }
        .left-corner-photo {
            position: absolute;
            top: 120px;
            left: 20px;
            width: 20vw;
            height: 20vw;
            max-width: 150px;
            max-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #f5f5f5;
            animation: fadeIn 3s ease-in-out;
        }
        .content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
        }
        .content p {
            margin: 5px 0;
        }

        /* Query Form Styles */
        .query-form {
            position: relative;
            bottom: 50px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
        }
        .query-form h2 {
            text-align: center;
        }
        .query-form input, .query-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #f5f5f5;
            background-color: #333;
            color: #f5f5f5;
        }
        .query-form input[type="submit"] {
            cursor: pointer;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 1rem;
        }

        /* Dark Mode Toggle */
        #toggle-theme {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 600px) {
            .left-corner-photo {
                top: 160px;
                left: 10px;
                width: 30vw;
                height: 30vw;
                max-width: 120px;
                max-height: 120px;
            }
            h1 {
                font-size: 2rem;
            }
            .content {
                left: 10px;
                right: 10px;
                bottom: 10px;
                padding: 15px;
            }
            .query-form {
                bottom: 20px;
            }
        }

        /* Animation Keyframes */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success message styles */
        .success-message {
            color: #28a745;
            font-size: 1.2rem;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to World of Hackers</h1>
    </header>

    <img src="pht.jpg" alt="Your Photo" class="left-corner-photo">

    <section class="content">
        <p>Hello, I am the leader of MG Hackers, and welcome to my world of ethical hacking!</p>
        <p>Stay tuned for exciting updates and tutorials on ethical hacking and cybersecurity.</p>
    </section>

    <!-- Query Form -->
    <section class="query-form">
        <h2>Have a Question?</h2>
        <form id="queryForm" action="https://formspree.io/f/movvyagp" method="POST">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="query">Your Query:</label><br>
            <textarea id="query" name="query" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Submit">
        </form>

        <!-- Success Message -->
        <div id="successMessage" class="success-message">
            Thank you for your query! We will get back to you soon.
        </div>
    </section>

    <!-- Dark Mode Toggle Button -->
    <button id="toggle-theme">Toggle Dark Mode</button>

    <script>
        const toggleButton = document.getElementById('toggle-theme');
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Handle form submission
        const form = document.getElementById('queryForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent the default form submission

            // Show success message
            successMessage.style.display = 'block';

            // Optionally reset the form after submission
            form.reset();

            // After 3 seconds, hide the success message
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        });
    </script>

    <style>
        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
    </style>

</body>
</html>
